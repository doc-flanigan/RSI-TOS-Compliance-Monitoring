name: RSI Compliance Audit

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rsi-compliance-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/rsi-cross-repo-compliance-ti5HT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m compliance audit

      - name: Commit report
        run: |
          git config user.name "rsi-compliance-bot"
          git config user.email "rsi-compliance-bot@users.noreply.github.com"
          git add compliance-reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "Compliance audit $(date -u +%Y-%m-%d)"
          git push origin HEAD:claude/rsi-cross-repo-compliance-ti5HT
